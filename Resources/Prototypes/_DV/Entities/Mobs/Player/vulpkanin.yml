- type: entity
  save: false
  name: Urist McVulp
  parent: BaseMobVulpkanin
  id: MobVulpkanin
  components:
    - type: CombatMode
    - type: VulpkaninJump # Aspis tweak
      action: ActionJumpVulpkanin
      jumpSound:
        path: /Audio/Weapons/punchmiss.ogg
        params:
          pitch: 1.33
          volume: -5
          variation: 0.05
    - type: VulpkaninSniff # Aspis tweak
    - type: InteractionPopup
      successChance: 1
      interactSuccessString: pat-success-generic # Frontier - pat-success-generic<hugging-success-generic
      interactSuccessSound: /Audio/Effects/thudswoosh.ogg
      messagePerceivedByOthers: pat-success-generic-others # Frontier - hugging-success-generic-others<pat-success-generic-others
    - type: MindContainer
      showExamineInfo: true
    - type: Input
      context: "human"
    - type: MobMover
    - type: InputMover
    - type: Alerts
    - type: Eye
    - type: CameraRecoil
    - type: Examiner
    - type: CanHostGuardian
    - type: NpcFactionMember
      factions:
        - NanoTrasen
    - type: Respirator
      damage:
       types:
        Asphyxiation: 1.0
      damageRecovery:
        types:
          Asphyxiation: -1.0
