- type: species
  id: Vulpkanin
  name: species-name-vulpkanin
  roundStart: true
  prototype: MobVulpkanin
  sprites: MobVulpkaninSprites
  clothingSpeciesFallback: # Aspis - clothing fallback
    outerClothing: Reptilian
    shoes: Reptilian
  defaultSkinTone: "#985629"
  markingLimits: MobVulpkaninMarkingLimits
  dollPrototype: MobVulpkaninDummy
  skinColoration: Hues
  maleFirstNames: names_vulpkanin_male
  femaleFirstNames: names_vulpkanin_female
  lastNames: names_vulpkanin_last

- type: speciesBaseSprites
  id: MobVulpkaninSprites
  sprites:
    TailBehind: MobHumanoidAnyMarking #DEN
    TailOversuit: MobHumanoidAnyMarking # DEN
    Head: MobVulpkaninHead
    Hair: MobHumanoidAnyMarking
    FacialHair: MobHumanoidAnyMarking
    Snout: MobHumanoidAnyMarking
    UndergarmentTop: MobHumanoidAnyMarking # Triad - Underwear.
    UndergarmentBottom: MobHumanoidAnyMarking # Triad - Underwear.
    Chest: MobVulpkaninTorso
    HeadTop: MobHumanoidAnyMarking
    HeadSide: MobHumanoidAnyMarking
    Tail: MobHumanoidAnyMarking
    Eyes: MobHumanoidEyes
    LArm: MobVulpkaninLArm
    RArm: MobVulpkaninRArm
    LHand: MobVulpkaninLHand
    RHand: MobVulpkaninRHand
    LLeg: MobVulpkaninLLeg
    RLeg: MobVulpkaninRLeg
    LFoot: MobVulpkaninLFoot
    RFoot: MobVulpkaninRFoot

- type: markingPoints
  id: MobVulpkaninMarkingLimits
  points:
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 1
      required: false
    Tail:
      points: 1
      required: true
      defaultMarkings: [ VulpTail ]
    Head:
      points: 8 # Triad - Increased to 8.
      required: false
    # Triad changes - Underwear.
    UndergarmentTop:
      points: 8
      required: false
    UndergarmentBottom:
      points: 8
      required: false
    # End Triad.
    Legs:
      points: 8 # Triad - Increased to 8.
      required: false
    Arms:
      points: 8 # Triad - Increased to 8.
      required: false
    Snout:
      points: 1
      required: false
    HeadTop:
      points: 1
      required: true
      defaultMarkings: [ VulpEar ]

