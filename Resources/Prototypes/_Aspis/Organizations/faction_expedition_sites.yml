# v47: larger hand-authored maps and bounded, one-time NPC encounters.
# The same physical-object objectives work on all catalog sites. Add more
# pre-existing Maps/*.yml here after checking walkability and docking in game.
# Hostiles are spawned only when a shuttle first commits to this site's FTL.
# These are server-only prototypes; not general sector POIs or player claims.

- type: aspisFactionExpeditionSite
  id: AspisFactionLostPrison
  name: Покинутий тюремний корабель
  gridPath: /Maps/Ruins/ruined_prison_ship.yml
  minimumConnectedFloor: 180
  minimumTraversalTiles: 24
  hostileCount: 7
  hostilePrototypes:
  - MobRogueSiliconScrapThrusters
  - MobRogueSiliconDroneLethals
  - MobRogueSiliconHunter
  hazardDescription: Пошкоджені тюремні системи й озброєні автономні дрони

